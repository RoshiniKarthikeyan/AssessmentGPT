spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/assessment}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:assessment}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:assessment}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.h2.console.enabled=false
